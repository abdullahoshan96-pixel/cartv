name: Refresh YouTube playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp and PO token plugin
        run: python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider

      - name: Build PO token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git pot-provider
          cd pot-provider/server
          npm ci
          npx tsc

      - name: Generate playlist
        run: python refresh_youtube.py

      - name: Commit refreshed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u
          if git diff --cached --quiet; then
            echo "No playlist change"
          else
            git commit -m "Refresh YouTube playlist"
            git push
          fi
