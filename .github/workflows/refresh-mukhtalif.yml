name: Refresh Mukhtalif playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mukhtalif.py'
      - '.github/workflows/refresh-mukhtalif.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate playlist
        run: python mukhtalif.py

      - name: Commit refreshed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mukhtalif.m3u
          if git diff --cached --quiet; then
            echo "No playlist change"
          else
            git commit -m "Refresh Mukhtalif playlist"
            git push
          fi
